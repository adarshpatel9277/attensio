<svg width="512" height="512" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sat_grad_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4F81" />
      <stop offset="55%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="sat_grad_check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>
    <filter id="sat_shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E11D48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Badge Base safely inside 64x64 canvas (30-58 bounds, rx=13) -->
  <rect x="7" y="7" width="50" height="50" rx="14" fill="url(#sat_grad_main)" filter="url(#sat_shadow)" />
  <rect x="7.5" y="7.5" width="49" height="49" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Calendar Ring Lugs -->
  <rect x="20" y="10" width="4.5" height="5.5" rx="2" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="39.5" y="10" width="4.5" height="5.5" rx="2" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Calendar Header Line -->
  <line x1="15" y1="23.5" x2="49" y2="23.5" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.8" stroke-linecap="round" />

  <!-- Calendar Date Dots -->
  <circle cx="22" cy="30.5" r="2" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="32" cy="30.5" r="2" fill="#FFFFFF" fill-opacity="0.5" />
  <circle cx="42" cy="30.5" r="2" fill="#FFFFFF" fill-opacity="0.5" />

  <!-- Bold Modern Attendance Checkmark -->
  <path d="M21 40.5 L29 48.5 L45 32" stroke="url(#sat_grad_check)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Amber Target Star/Dot -->
  <circle cx="46" cy="18" r="2.5" fill="#FBBF24" />
</svg>
